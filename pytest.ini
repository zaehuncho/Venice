[pytest]
# Put the repo root on sys.path so the detector tests can `import meter_detector` etc. without a manual
# PYTHONPATH (several test files don't self-insert the root, and there is no root conftest).
pythonpath = .
# Root pytest is an allowlisted release gate, not a recursive repository crawler.
# Keep the active application suite and the packer/container ABI contracts here;
# tests/backend remains a standalone suite with its own configuration/dependencies.
testpaths =
    tests
    tools/security/packer/tests
# tests/backend is a STANDALONE suite (its own pytest.ini, moto/boto3 deps, different rootdir
# semantics) — run it separately: C:/Python314/python.exe -m pytest tests/backend
# Collecting it from the repo root errors on conftest/rootdir mismatch, so exclude it here.
norecursedirs =
    tests/backend
    .git
    .claude
    .tokensave
    .venv
    .venv311
    build
    build_*
    native_orion/build*
    tools/diagnostics
    node_modules
    chiaki-ng-src
markers =
    slow: expensive offline regression gates (full framedump replay; tens of minutes). Deselect with -m "not slow" or set ORION_SKIP_SLOW_REGRESSION=1.
